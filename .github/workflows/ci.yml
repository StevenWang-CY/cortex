name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.10.12"
  PYTHON_PRIMARY: "3.11.15"
  NODE_VERSION: "22.23.2"
  PNPM_VERSION: "9.15.9"

jobs:
  repository-contracts:
    name: docs-links-config-version-schema
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Run before dependency installation so ignored package READMEs are not
      # part of the crawl; repository-local targets have a separate checker.
      - name: External Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml --no-progress "./**/*.md"
          fail: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_PRIMARY }}
          enable-cache: true
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Activate exact pnpm without the action-setup version shim
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"
      - name: Install frozen dependency graphs
        run: |
          uv sync --project cortex --locked --extra codegen
          pnpm --dir cortex/apps/browser_extension install --frozen-lockfile
      - name: Generated schema drift
        run: uv run --project cortex --locked --extra codegen python -m cortex.scripts.generate_ts_schemas --check
      - name: Repository contracts
        run: uv run --project cortex --locked --extra codegen python -m cortex.scripts.verify_repository_contracts
  dependency-audit:
    name: dependency-audit-policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_PRIMARY }}
          enable-cache: true
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Activate exact pnpm without the action-setup version shim
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"
      - name: Install frozen dependency graphs
        run: |
          uv sync --project cortex --locked --extra dev --extra codegen
          pnpm --dir cortex/apps/browser_extension install --frozen-lockfile
          npm --prefix cortex/apps/vscode_extension ci
      - name: Generate machine-readable audit reports
        run: |
          mkdir -p audit-results
          uv run --project cortex --locked --extra dev pip-audit --format json --output audit-results/python.json || true
          pnpm --dir cortex/apps/browser_extension audit --json > audit-results/browser.json || true
          npm --prefix cortex/apps/vscode_extension audit --json > audit-results/vscode.json || true
      - name: Enforce vulnerability and exception policy
        run: |
          status=0
          uv run --project cortex --locked --extra dev python cortex/scripts/verify_dependency_audit.py --ecosystem pip --report audit-results/python.json --summary-out audit-results/python-summary.json || status=1
          uv run --project cortex --locked --extra dev python cortex/scripts/verify_dependency_audit.py --ecosystem pnpm --report audit-results/browser.json --exceptions cortex/security/node-audit-exceptions.json --summary-out audit-results/browser-summary.json || status=1
          uv run --project cortex --locked --extra dev python cortex/scripts/verify_dependency_audit.py --ecosystem npm --report audit-results/vscode.json --summary-out audit-results/vscode-summary.json || status=1
          exit "${status}"
      - if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dependency-audit-reports
          path: audit-results/*.json
          if-no-files-found: error
          retention-days: 30

  python:
    name: python-full-${{ matrix.arch }}-py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            python: "3.11.15"
          - runner: macos-15-intel
            arch: x86_64
            python: "3.12.13"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    env:
      # Override the repository's primary .python-version for the compatibility
      # matrix row; every uv invocation in the shared gate inherits this.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Resolve only from committed lock
        run: uv sync --project cortex --locked --extra dev --extra codegen
      - name: Verify exact interpreter architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_PYTHON: ${{ matrix.python }}
        run: uv run --project cortex --locked python -c 'import platform, os; actual=(platform.python_version(), platform.machine()); expected=(os.environ["EXPECTED_PYTHON"], os.environ["EXPECTED_ARCH"]); assert actual == expected, (actual, expected)'
      - name: Audit the resolved architecture-specific Python graph
        run: |
          mkdir -p audit-results
          uv run --project cortex --locked --extra dev pip-audit \
            --format json \
            --output "audit-results/python-${{ matrix.arch }}.json" || true
          audit_exception_args=()
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            audit_exception_args=(--exceptions cortex/security/python-intel-audit-exceptions.json)
          fi
          uv run --project cortex --locked --extra dev python \
            cortex/scripts/verify_dependency_audit.py \
            --ecosystem pip \
            --report "audit-results/python-${{ matrix.arch }}.json" \
            --summary-out "audit-results/python-${{ matrix.arch }}-summary.json" \
            "${audit_exception_args[@]}"
      - name: Canonical Python gate
        run: ./cortex/scripts/run_python_gate.sh
      - if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: python-audit-${{ matrix.arch }}
          path: audit-results/*.json
          if-no-files-found: error
          retention-days: 30

  eval-regression:
    name: recorded-trace-regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_PRIMARY }}
          enable-cache: true
      - name: Install from lock
        run: uv sync --project cortex --locked --extra dev
      - name: Run committed regression baseline
        run: uv run --project cortex --locked --extra dev python -m cortex.services.eval.regression_harness

  extension:
    name: browser-type-test-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cortex/apps/browser_extension
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_PRIMARY }}
          enable-cache: true
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Activate exact pnpm without the action-setup version shim
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"
      - name: Install frozen Python/native and browser graphs
        run: |
          uv sync --project ../.. --locked
          echo "${GITHUB_WORKSPACE}/cortex/.venv/bin" >> "${GITHUB_PATH}"
          pnpm install --frozen-lockfile
      - name: Typecheck and test
        run: |
          pnpm exec tsc --noEmit
          pnpm test
      - name: Build Chrome and Edge MV3
        run: |
          pnpm exec plasmo build
          pnpm exec plasmo build --target=edge-mv3

  extension-vscode:
    name: vscode-compile-test-package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cortex/apps/vscode_extension
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cortex/apps/vscode_extension/package-lock.json
      - name: Frozen install, lint, compile, and test
        run: |
          npm ci
          npm run lint
          npm run compile
          npm test
      - name: Package locked VSIX
        run: npm exec -- vsce package --out "${{ runner.temp }}/cortex-somatic.vsix"
