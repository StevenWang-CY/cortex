cache = true
max_retries = 3
retry_wait_time = 2
timeout = 20
# NCBI/PubMed deliberately returns 203 for valid publication records to some
# automated clients. Rate-limited 429 endpoints are retried before acceptance.
accept = [200, 203, 204, 206, 429]
exclude = [
  "^https://example\\.invalid",
  # docs.opencv.org answers 403 to every automated client (verified
  # 2026-09-05, including its own root with a browser user agent). The
  # reference in IMPLEMENTATION.md stays; only the reachability probe is
  # excluded, and it is re-checked whenever this list is reviewed.
  "^https://docs\\.opencv\\.org",
  "^https?://(127\\.0\\.0\\.1|localhost)",
  "^https://github\\.com/StevenWang-CY/cortex/security/advisories/new$"
]
exclude_path = [
  "cortex/apps/browser_extension/node_modules",
  "cortex/apps/browser_extension/.plasmo",
  "cortex/apps/vscode_extension/node_modules",
  "cortex/apps/vscode_extension/out",
  "build",
  "dist"
]
