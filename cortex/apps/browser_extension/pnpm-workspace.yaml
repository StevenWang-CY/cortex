packages:
  - "."

# Plasmo + native deps require build scripts to run on install
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  sharp: true
overrides:
  # Audited patch lifts for build/test-only transitive dependencies. Keep
  # exact targets: unconstrained `>=` overrides can jump Parcel plugins
  # across incompatible majors and make Plasmo report errors with exit 0.
  '@babel/core@<=7.29.0': 7.29.6
  '@babel/traverse@<7.23.2': 7.23.2
  content-security-policy-parser@<0.6.0: 0.6.0
  esbuild@<=0.24.2: 0.25.0
  msgpackr@<1.10.1: 1.10.1
  sharp@<0.35.0: 0.35.0
