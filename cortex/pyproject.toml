[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortex"
version = "0.3.9"
description = "Local sensing and conservative workspace-support research prototype"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Cortex Maintainers", email = "noreply@cortex.invalid" }
]
maintainers = [
    { name = "Cortex Maintainers", email = "noreply@cortex.invalid" }
]
keywords = [
    "biofeedback",
    "rppg",
    "workspace",
    "cognitive-load",
    "computer-vision",
    "anthropic",
    "claude",
    "mediapipe",
    "macos",
    "signal-processing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # API Framework
    "fastapi>=0.141.1",
    # Cortex imports Starlette directly. This floor also excludes the
    # multipart/range parsing advisories fixed across the 1.0-1.3 line.
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.27.0",
    "click>=8.3.3",
    "websockets>=12.0",

    # Data Validation & Config
    # Upper bound: the bundled ``pydantic.mypy`` plugin (enabled in
    # [tool.mypy]) must stay ABI-compatible with the pinned mypy in the
    # [dev] extra. Bumping across a major requires re-validating the gate.
    "pydantic>=2.6.0,<3",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",

    # Computer Vision & Face Tracking
    # MediaPipe already requires the contrib distribution, which is a superset
    # of the base OpenCV wheel. Installing both distributions makes two wheels
    # own the same ``cv2`` package and lets install order bypass this major cap.
    # Keep exactly one provider and test major upgrades through the installed-
    # artifact camera/release matrix.
    "opencv-contrib-python>=4.9.0,<5",
    # MediaPipe dropped macOS Intel wheels after 0.10.21. Keep the last
    # universal/Intel build on that architecture while arm64/Linux receive the
    # maintained line; both branches run the same source and full test gate.
    "mediapipe==0.10.21 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "mediapipe>=0.10.22,<1 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # Explicit transitive security floors: these ship through MediaPipe,
    # Google auth, and Keychain/provider paths even though Cortex does not
    # import each package directly.
    "pillow>=12.3.0",
    "cryptography>=50.0.0",
    "idna>=3.15",
    "pyasn1>=0.6.4",

    # Signal Processing & Numerics
    "scipy>=1.12.0",
    # MediaPipe's final Intel wheel requires NumPy 1.x. The exclusive markers
    # make the architecture split explicit and lockable instead of allowing a
    # resolver-dependent downgrade on arm64/Linux.
    "numpy>=1.26.4,<2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=2.3.5,<2.4 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",

    # Input Telemetry
    "pynput>=1.7.6",

    # Desktop UI
    "PySide6>=6.6.0",

    # macOS Keychain for BYOK storage
    "keyring>=24.3.0",

    # HTTP Client
    "httpx>=0.26.0",

    # Anthropic SDK — production LLM path (AWS Bedrock primary,
    # direct Anthropic / Vertex as escape hatches behind the same
    # interface, per ADR-0004-style provider routing).
    # The 1.x SDK removed request parameters used by the reviewed planner.
    # Migrate deliberately with transport fixtures before lifting this bound.
    "anthropic[bedrock,vertex]>=0.39.0,<1",
    "boto3>=1.34.0",

    # ML Inference
    "onnxruntime>=1.17.0",

    # macOS-specific (optional)
    "pyobjc-framework-AVFoundation>=10.1; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.1; sys_platform == 'darwin'",
    "pyobjc-framework-CoreAudio>=10.1; sys_platform == 'darwin'",
    # P0 §3.12: UNUserNotificationCenter for OS-level intervention
    # banners when the desktop dashboard is not the key window.
    "pyobjc-framework-UserNotifications>=10.1; sys_platform == 'darwin'",

    # Structured Logging
    "structlog>=24.1.0",

    # Metrics / observability — P1-19
    "prometheus-client>=0.19.0",

    # Redis
    "redis[hiredis]>=5.0.0,<8",
]

[project.urls]
Homepage = "https://github.com/StevenWang-CY/cortex"
Repository = "https://github.com/StevenWang-CY/cortex"
Documentation = "https://github.com/StevenWang-CY/cortex/wiki"
Changelog = "https://github.com/StevenWang-CY/cortex/blob/main/CHANGELOG.md"
Issues = "https://github.com/StevenWang-CY/cortex/issues"
Releases = "https://github.com/StevenWang-CY/cortex/releases"

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.12.0",

    # Type Checking
    # Upper bound pins the plugin-loading ABI: the in-tree gate runs with
    # ``plugins = ["pydantic.mypy"]`` and pydantic>=2.6,<3. The 1.19.x line
    # is the validated pair; lifting the cap requires re-running the full
    # ``mypy --config-file cortex/pyproject.toml cortex/ --strict`` gate.
    "mypy>=1.17.0,<1.20",

    # Linting & Formatting
    "ruff>=0.2.0",

    # Development utilities
    "ipython>=9.14.0",
    "rich>=13.7.0",
    "pygments>=2.20.0",
    "pyinstaller>=6.6.0",
    "pip-audit>=2.10.1,<3",
    "pre-commit>=4.3.0,<5",
    "jsonschema[format]>=4.25.0,<5",

    # Schema codegen — Pydantic → TypeScript (Debt-1 closure).
    # ``pydantic-to-typescript`` is the actively-maintained package
    # (formerly known as ``pydantic2ts``); imports as ``pydantic2ts``.
    # Requires the ``json2ts`` binary from ``json-schema-to-typescript``
    # to be on PATH (installed via ``npm i -g json-schema-to-typescript``
    # or co-located in the browser extension's pnpm workspace).
    "pydantic-to-typescript>=2.0.0",
]

# Dedicated codegen extra for CI jobs that only need the schema generator
# without pulling the full dev toolchain (mypy, pyinstaller, etc.).
codegen = [
    "pydantic-to-typescript>=2.0.0",
]

[project.scripts]
cortex-dev = "cortex.scripts.run_dev:main"
cortex-capture = "cortex.scripts.run_capture:main"
cortex-calibrate = "cortex.scripts.calibrate:main"

[tool.hatch.build]
# The source rewrite below adds the package prefix for distributable wheels.
# Editable installs instead expose the repository root so ``import cortex``
# resolves this project directory without relying on unsupported prefix-adding
# behavior from the ``editables`` backend.
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel]
# ``pyproject.toml`` lives inside the package directory in this repository,
# rather than beside it. Explicit mappings avoid the former ``cortex/cortex``
# lookup (which silently produced a metadata-only wheel) and keep browser/
# editor source trees and tests out of the Python artifact.
#
# Use ordinary explicit selection so Hatch respects both VCS ignores and the
# denylist below. ``force-include`` recursively admits ignored files and made a
# developer-only native-host log alter local wheel contents. The source rewrite
# restores the required ``cortex/`` package prefix without that bypass.
only-include = [
    "__init__.py",
    "_version.py",
    "application",
    "apps/__init__.py",
    "apps/desktop_shell",
    "assets/audio",
    "assets/logo.svg",
    "libs",
    "models",
    "scripts",
    "services",
    "storage",
]
exclude = [
    "**/.DS_Store",
    "**/.env",
    "**/.env.*",
    "**/__pycache__/**",
    "**/*.pyc",
    "**/*.pyo",
    "**/*.log",
    "**/*.pem",
    "**/*.key",
    "**/*.p8",
    "**/*.p12",
    "**/*.pfx",
    "**/*.jks",
    "**/*.keystore",
    "**/*.db",
    "**/*.sqlite",
    "**/*.sqlite3",
]

[tool.hatch.build.targets.wheel.sources]
"" = "cortex"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "requires_webcam: marks tests that require a webcam",
    "requires_gpu: marks tests that require GPU",
]

[tool.uv]
# The universal lockfile is generated and consumed with this exact uv release.
# Upgrade this value and ``uv.lock`` together so resolver changes are reviewed.
required-version = "==0.10.12"
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.coverage.run]
branch = true
source = ["cortex"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 85

[tool.mypy]
python_version = "3.11"
# pydantic.mypy teaches mypy that BaseModel fields with defaults are
# optional constructor args. Without it, every ``Model(...)`` call with a
# defaulted field emits a spurious [call-arg] "Missing named argument"
# error (~1640 across the tree). The plugin ships inside pydantic itself;
# the mypy/pydantic versions are pinned in the [dev] extra so the plugin
# ABI always matches the mypy that loads it.
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

# Tests use pytest conventions (def test_foo(): without return annotation)
# and rely on Qt / MediaPipe / Pydantic monkey-patch stubs that mypy can't
# resolve. Loosen the strict gates here so the production code stays
# fully typed without forcing every fixture to annotate -> None.
# The disable_error_code list suppresses the ``--strict``-only diagnostics
# that fire purely against pytest/Qt-stub idioms (bare dict/list generics,
# calls into untyped helpers, the lightweight PySide6 stub surface). Real
# "name does not exist" bugs in tests still surface via ``name-defined``.
[[tool.mypy.overrides]]
module = "cortex.tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_return_any = false
warn_unused_ignores = false
disable_error_code = [
    "type-arg", "no-untyped-call", "attr-defined", "annotation-unchecked",
    "arg-type", "assignment", "union-attr", "misc", "return-value",
    "var-annotated", "index", "no-redef", "operator", "call-overload",
    "comparison-overlap", "func-returns-value",
]

# Tests directly poke private QWidget attributes that the lightweight
# PySide6 stubs intentionally don't expose; mypy can't tell. Same for
# scripts that use opt-in third-party libs (yaml). Scripts are operational
# glue, not the typed production surface, so the same strictness-noise codes
# are suppressed here.
[[tool.mypy.overrides]]
module = "cortex.scripts.*"
disallow_untyped_defs = false
warn_return_any = false
disable_error_code = ["type-arg", "no-untyped-call", "attr-defined"]

# Desktop shell uses lazy Qt imports + a stub fallback path that
# mypy cannot reconcile against the real PySide6 surface. Production
# code is type-checked via test runs; here we accept the looser gate for
# the Qt-stub-induced noise (bare generics, the try/except-import no-redef
# pattern, stub-surface union/arg mismatches). ``name-defined`` and
# ``attr-defined`` stay ENABLED so genuine missing-symbol bugs (e.g. the
# AppKit.NSObject base-class references) are still caught.
[[tool.mypy.overrides]]
module = "cortex.apps.desktop_shell.*"
disallow_untyped_defs = false
warn_return_any = false
disable_error_code = [
    "type-arg", "no-untyped-call", "no-redef", "annotation-unchecked",
    "union-attr", "arg-type", "misc", "call-overload", "override",
    "assignment", "func-returns-value",
]

# macOS-only frameworks (AVFoundation, ApplicationServices) have no
# stubs available on the Ubuntu CI runner — let those imports flow.
[[tool.mypy.overrides]]
module = ["AVFoundation", "ApplicationServices", "Foundation", "AppKit", "yaml"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "E741",  # ambiguous variable name (l, I, O) — accepted in tight list comps
]

[tool.ruff.lint.per-file-ignores]
# Tests use looser patterns: late imports after docstring/header banners,
# unused loop vars in synthetic event generators, blind exception assertions
# for schema validation, and StopAsyncIteration without `from None` is the
# canonical async-generator-end pattern.
# Patterns are relative to this pyproject.toml's location.
"tests/**/*.py" = ["E402", "B007", "B011", "B017", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["cortex"]
